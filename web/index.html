<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111'/%3E%3Cg fill='%23fff'%3E%3Crect x='18' y='14' width='10' height='36'/%3E%3Crect x='18' y='40' width='28' height='10'/%3E%3Crect x='36' y='24' width='10' height='10'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f4f0; --panel: #ffffff; --panel-2: #faf9f6; --ink: #1c1b19; --muted: #6e6b64; --line: #e6e3dc;
    --accent: #111111; --accent-ink: #ffffff; --accent-soft: #ecebe7;
    --user: #111111; --user-ink: #ffffff; --logo-bg: #111111; --logo-fg: #ffffff;
    --ok: #2b8a3e; --err: #c92a2a; --warn: #f08c00; --chip: #f0eee9; --side: #efede8;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 24px rgba(0,0,0,.06);
    --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  :root[data-theme="dark"] {
    --bg: #121214; --panel: #1b1b1f; --panel-2: #17171a; --ink: #ecebe8; --muted: #9b98a3; --line: #2b2b31;
    --accent: #f2f1ee; --accent-ink: #111111; --accent-soft: #2a2a2e;
    --user: #f2f1ee; --user-ink: #111111; --logo-bg: #f2f1ee; --logo-fg: #111111;
    --ok: #69db7c; --err: #ff8787; --warn: #ffc078; --chip: #232328; --side: #161619;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121214; --panel: #1b1b1f; --panel-2: #17171a; --ink: #ecebe8; --muted: #9b98a3; --line: #2b2b31;
      --accent: #f2f1ee; --accent-ink: #111111; --accent-soft: #2a2a2e;
      --user: #f2f1ee; --user-ink: #111111; --logo-bg: #f2f1ee; --logo-fg: #111111;
      --ok: #69db7c; --err: #ff8787; --warn: #ffc078; --chip: #232328; --side: #161619;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
         display: flex; overflow: hidden; -webkit-font-smoothing: antialiased; }
  html.theming * { transition: background-color .3s, border-color .3s, color .3s !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg { display: block; }
  .ico { width: 19px; height: 19px; }

  /* ---------- histórico (lateral) */
  #history { width: 300px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex;
             flex-direction: column; transition: margin-left .3s var(--ease); z-index: 7; }
  body.hist-closed #history { margin-left: -300px; }
  .hist-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 14px; }
  .hist-head b { flex: 1; font-size: 14px; }
  .new-btn { display: flex; align-items: center; gap: 10px; margin: 4px 10px 8px; padding: 9px 12px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 14px;
             transition: transform .15s var(--ease), border-color .15s; }
  .new-btn:hover { border-color: var(--ink); }
  .new-btn:active { transform: scale(.98); }
  .new-btn svg { width: 17px; height: 17px; }
  #chatlist { flex: 1; overflow-y: auto; padding: 0 8px 12px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  #chatlist h5 { margin: 14px 8px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .chat-item { position: relative; display: flex; align-items: center; width: 100%; border: 0; background: none; text-align: left;
               padding: 8px 34px 8px 10px; border-radius: 9px; font-size: 14px; color: var(--ink); }
  .chat-item span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .chat-item:hover { background: var(--chip); }
  .chat-item.on { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; }
  .chat-item.new { animation: rise .35s var(--ease) both; }
  .chat-item .del { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px;
                    display: grid; place-items: center; border-radius: 7px; color: var(--muted); opacity: 0; transition: opacity .15s; }
  .chat-item:hover .del, .chat-item .del:focus-visible { opacity: 1; }
  .chat-item .del:hover { background: var(--line); color: var(--err); }
  .chat-item .del svg { width: 15px; height: 15px; }
  .hist-empty { color: var(--muted); font-size: 13px; padding: 16px 10px; }
  .hist-foot { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }

  /* ---------- área principal */
  .app { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--panel);
           border-bottom: 1px solid var(--line); }
  .avatar { width: 38px; height: 38px; border-radius: 10px; flex: none; background: var(--logo-bg); color: var(--logo-fg); }
  .avatar svg { width: 100%; height: 100%; fill: currentColor; }
  .avatar.sm { width: 28px; height: 28px; border-radius: 7px; }
  .avatar.busy svg rect:last-child, .row.thinking .avatar svg rect:last-child { animation: blink .9s steps(1) infinite; }
  .title { flex: 1; min-width: 0; }
  .title b { display: block; font-size: 16px; letter-spacing: .1px; }
  .title small { color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
  .title small span { overflow: hidden; text-overflow: ellipsis; }
  @keyframes pulse { 50% { opacity: .35; } }
  .icon-btn { display: grid; place-items: center; width: 36px; height: 36px; background: none; border: 1px solid transparent;
              border-radius: 10px; color: var(--muted); flex: none; transition: background .15s, color .15s, transform .15s var(--ease); }
  .icon-btn:hover { background: var(--chip); color: var(--ink); }
  .icon-btn:active { transform: scale(.92); }
  #gear svg { transition: transform .5s var(--spring); }
  #gear:hover svg { transform: rotate(60deg); }
  .icon-btn:focus-visible, .send:focus-visible, .chip:focus-visible, .new-btn:focus-visible, .chat-item:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- conversa */
  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  main::-webkit-scrollbar, #chatlist::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-button, #chatlist::-webkit-scrollbar-button { display: none; }
  main::-webkit-scrollbar-thumb, #chatlist::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
  .log { max-width: 780px; margin: 0 auto; padding: 24px 16px 12px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 10px; align-items: flex-end; animation: in-bot .38s var(--ease) both; transform-origin: bottom left; }
  .row.user { justify-content: flex-end; animation-name: in-user; transform-origin: bottom right; }
  .row.bot { align-items: flex-start; }
  .row.bot .time { align-self: flex-end; }
  @keyframes in-bot { from { opacity: 0; transform: translate(-10px, 6px) scale(.97); } }
  @keyframes in-user { from { opacity: 0; transform: translate(10px, 6px) scale(.97); } }
  .log.restored .row, .log.restored .tk, .log.restored .st path, .log.restored .out { animation: none; }
  .log.swap { animation: fade .3s var(--ease); }
  @keyframes fade { from { opacity: 0; } }
  .row.bot .avatar { visibility: hidden; }
  .row.bot.first .avatar { visibility: visible; }
  .row.first { margin-top: 10px; }
  .msg { max-width: min(78%, 620px); padding: 9px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .user .msg { background: var(--user); color: var(--user-ink); border-bottom-right-radius: 6px; }
  .bot .msg { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 6px; box-shadow: var(--shadow); }
  .bot .msg.typing::after { content: "▍"; animation: blink .9s steps(1) infinite; color: var(--ink); margin-left: 1px; }
  .bot .msg.alert { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, var(--panel)); }
  .tk { animation: tk .4s ease-out both; }
  @keyframes tk { from { opacity: 0; filter: blur(3px); } }
  @keyframes blink { 50% { opacity: 0; } }
  .dots { display: inline-flex; gap: 4px; padding: 4px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 2px; background: var(--muted); animation: bounce 1.2s infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
  .time { font-size: 11px; color: var(--muted); opacity: 0; transition: opacity .15s; align-self: center; flex: none; }
  .row:hover .time { opacity: 1; }
  .fb { font: inherit; font-size: 11px; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 8px;
        padding: 1px 7px; cursor: pointer; opacity: 0; transition: opacity .15s, border-color .15s, color .15s; align-self: flex-end; }
  .row:hover .fb { opacity: 1; }
  .fb:hover { border-color: var(--line); color: var(--ink); }
  .fb.done { opacity: 1; color: var(--warn); cursor: default; }
  @media (hover: none) { .fb { opacity: .7; } }

  /* ferramenta: uma linha compacta (ícone, ação, argumento, resultado, status) */
  .tool { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; max-width: min(78%, 620px);
          padding: 6px 12px 6px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2);
          font-size: 13.5px; color: var(--muted); line-height: 1.4; transition: border-color .25s; }
  .tool svg { width: 16px; height: 16px; flex: none; }
  .tool .ti { display: flex; color: var(--ink); }
  .tool.wait .ti { animation: pulse 1.2s ease-in-out infinite; }
  .tool .arg { color: var(--ink); font-weight: 600; word-break: break-word; }
  .tool .out { color: var(--ink); word-break: break-word; }
  .tool .out:not(:empty) { animation: slide-in .35s var(--ease) both; }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-6px); } }
  .tool .out::before { content: "→ "; color: var(--muted); }
  .tool .arg:empty, .tool .out:empty { display: none; }
  .tool .st { display: flex; }
  .tool.ok .st path, .tool.err .st path, .tool.off .st path { stroke-dasharray: 30; animation: draw .5s var(--ease) both; }
  @keyframes draw { from { stroke-dashoffset: 30; } }
  .tool.ok .st { color: var(--ok); }
  .tool.err .st, .tool.err .out { color: var(--err); }
  .tool.off .out, .tool.off .st { color: var(--muted); }
  .tool.ask { border-color: var(--ink); }
  .tool .actions { flex-basis: 100%; display: flex; gap: 8px; margin: 6px 0 2px; align-items: center; flex-wrap: wrap;
                   animation: drop .3s var(--ease) both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-5px); } }
  .tool .actions small { color: var(--muted); font-size: 12px; }
  .tool button { border: 0; border-radius: 8px; padding: 5px 14px; font-weight: 600; font-size: 13.5px;
                 transition: transform .15s var(--ease), opacity .15s, background .15s; }
  .tool button:active { transform: scale(.95); }
  .tool .yes { background: var(--accent); color: var(--accent-ink); }
  .tool .yes:hover { opacity: .88; }
  .tool .no { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .tool .no:hover { background: var(--chip); }
  /* conselho na conversa: uma linha que leva à sala */
  .debate-link { display: inline-flex; align-items: center; gap: 8px; max-width: min(78%, 620px); font-size: 13px;
                 color: var(--muted); background: none; border: 1px dashed var(--line); border-radius: 12px;
                 padding: 5px 12px 5px 8px; text-align: left; animation: drop .3s var(--ease) both;
                 transition: border-color .15s, color .15s; }
  .debate-link:hover { border-color: var(--ink); color: var(--ink); }
  .debate-link b { color: var(--ink); font-weight: 600; }
  .debate-link .faces { display: flex; }
  .debate-link .faces .ag { width: 20px; height: 20px; font-size: 9.5px; margin-left: -5px; box-shadow: 0 0 0 2px var(--bg); }
  .debate-link .faces .ag:first-child { margin-left: 0; }
  .debate-link .go { margin-left: 2px; white-space: nowrap; }
  .spin { width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--ink); border-radius: 50%;
          animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* tela inicial */
  .empty { text-align: center; margin: 4vh auto 0; max-width: 560px; }
  .empty h2, .empty p { animation: rise .6s var(--ease) both; }
  .empty h2 { animation-delay: .08s; } .empty p { animation-delay: .14s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .empty .avatar { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 18px; animation: pop .6s var(--spring) both; }
  .empty .avatar svg rect:last-child { animation: blink .9s steps(1) 3 .6s; }
  @keyframes pop { from { opacity: 0; transform: scale(.6) rotate(-8deg); } }
  .empty h2 { font-size: 26px; font-weight: 650; margin: 0 0 6px; letter-spacing: -.2px; }
  .empty p { color: var(--muted); margin: 0; }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 24px; text-align: left; }
  .chip { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line);
          border-radius: 14px; padding: 10px 12px; text-align: left;
          transition: border-color .15s, transform .2s var(--ease), box-shadow .2s;
          animation: rise .5s var(--ease) both; animation-delay: calc(.2s + var(--i, 0) * .05s); }
  .chip:hover { border-color: var(--ink); transform: translateY(-2px); box-shadow: var(--shadow); }
  .chip:active { transform: scale(.98); }
  .chip .ci { display: flex; color: var(--muted); }
  .chip svg { width: 18px; height: 18px; }

  /* ---------- caixa de texto */
  footer { padding: 10px 16px 14px; }
  form { max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; background: var(--panel);
         border: 1px solid var(--line); border-radius: 18px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow);
         transition: border-color .2s; }
  form:focus-within { border-color: color-mix(in srgb, var(--ink) 45%, var(--line)); }
  textarea { flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: inherit; font: inherit;
             max-height: 180px; padding: 7px 0; }
  textarea::placeholder { color: var(--muted); }
  .send { display: grid; place-items: center; width: 38px; height: 38px; background: var(--accent); color: var(--accent-ink);
          border: 0; border-radius: 12px; flex: none; transition: transform .2s var(--spring), opacity .2s; }
  .send:hover:not(:disabled) { transform: scale(1.06); }
  .send:hover:not(:disabled) svg { animation: nudge .5s var(--ease); }
  .send:active:not(:disabled) { transform: scale(.9); }
  @keyframes nudge { 40% { transform: translateY(-3px); } }
  .send:disabled { opacity: .3; cursor: default; }
  .hint { max-width: 780px; margin: 6px auto 0; color: var(--muted); font-size: 12px; text-align: center; }
  kbd { font: 11px/1 inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; }

  /* ---------- configurações */
  #shade { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); z-index: 6; }
  #shade.open { opacity: 1; pointer-events: auto; }
  #settings { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100vw); background: var(--panel);
              border-left: 1px solid var(--line); box-shadow: var(--shadow); padding: 18px; overflow-y: auto; z-index: 8;
              transform: translateX(100%); transition: transform .35s var(--ease); scrollbar-width: thin; }
  #settings.open { transform: none; }
  #settings h3 { margin: 0; font-size: 17px; flex: 1; }
  #settings .head { display: flex; align-items: center; margin-bottom: 8px; }
  #settings h4 { margin: 18px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
  #settings label { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; }
  #settings label small { color: var(--muted); display: block; font-size: 12.5px; }
  .switch { appearance: none; width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative;
            cursor: pointer; flex: none; transition: background .2s; margin: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
                   background: #fff; transition: transform .3s var(--spring); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .switch:checked { background: var(--accent); }
  .switch:checked::after { transform: translateX(16px); background: var(--accent-ink); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .range-labels { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 5px 0; color: var(--muted); font-size: 13.5px;
                transition: background .2s, color .2s; }
  .seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
  #toollist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #toollist li { display: grid; grid-template-columns: 26px 1fr; gap: 0 8px; font-size: 13.5px; align-items: center; }
  #toollist li > span:first-child { display: flex; color: var(--muted); }
  #toollist li svg { width: 16px; height: 16px; }
  #toollist li small { grid-column: 2; color: var(--muted); font-size: 12px; }
  #toollist .tag { color: var(--warn); font-size: 11px; margin-left: 4px; }

  /* ---------- contatos: a Lia, o grupo do conselho e os agentes que você cria */
  .bl { width: 40px; height: 40px; flex: none; display: block; }
  .bl svg { width: 100%; height: 100%; display: block; }
  .bl.lia { border-radius: 11px; background: var(--logo-bg); color: var(--logo-fg); }
  .bl.lia svg { fill: currentColor; }
  .bl.you { border-radius: 50%; background: var(--user); color: var(--user-ink); display: grid; place-items: center;
            font-size: 11px; font-weight: 700; }
  .avatar.bl { background: none; border-radius: 0; }
  .avatar.bl.lia { background: var(--logo-bg); border-radius: 7px; }
  #hlogo.bl.lia { border-radius: 10px; }
  #contacts { flex: 1; overflow-y: auto; padding: 4px 8px 8px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .contact { display: flex; gap: 11px; align-items: center; width: 100%; border: 0; background: none; text-align: left;
             padding: 8px 10px; border-radius: 12px; color: var(--ink); animation: rise .35s var(--ease) both;
             transition: background .15s; }
  .contact:hover { background: var(--chip); }
  .contact.on { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .contact .cc { flex: 1; min-width: 0; }
  .contact .top { display: flex; gap: 6px; align-items: baseline; }
  .contact .top b { flex: 1; min-width: 0; font-size: 14.5px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .contact .top time { font-size: 11.5px; color: var(--muted); flex: none; }
  .contact .pv { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .contact .pv span { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .contact.unread .top b { font-weight: 700; }
  .contact.unread .pv::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; flex: none; }
  .contact.typing .pv span { font-style: italic; }
  .side-sep { margin: 12px 10px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .add-agent { display: flex; align-items: center; gap: 11px; width: 100%; padding: 8px 10px; border: 1px dashed var(--line);
               border-radius: 12px; background: none; color: var(--muted); font-size: 14px; margin-top: 4px;
               transition: border-color .15s, color .15s; }
  .add-agent:hover { border-color: var(--ink); color: var(--ink); }
  .add-agent span { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); }
  .add-agent svg { width: 18px; height: 18px; }
  .side-foot { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .side-foot button { display: flex; align-items: center; gap: 10px; border: 0; background: none; color: var(--ink);
                      padding: 6px 8px; border-radius: 9px; font-size: 14px; flex: 1; }
  .side-foot button:hover { background: var(--chip); }
  .side-foot svg { width: 18px; height: 18px; }

  /* conversa vazia de um agente */
  .ag-empty { text-align: center; margin: 6vh auto 0; max-width: 460px; color: var(--muted); }
  .ag-empty .bl { width: 72px; height: 72px; margin: 0 auto 14px; animation: pop .6s var(--spring) both; }
  .ag-empty h2 { color: var(--ink); font-size: 24px; margin: 0 0 4px; }
  .ag-empty p { margin: 0 0 14px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .tag2 { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: var(--chip);
          color: var(--ink); font-size: 12.5px; }
  .tag2 svg { width: 14px; height: 14px; }
  .routine-msg .msg { border-left: 3px solid var(--warn); }

  /* ---------- grupo do conselho (no centro, como um chat em grupo) */
  #c-log { max-width: 780px; margin: 0 auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
  #c-log[hidden], #c-typing[hidden], .log[hidden] { display: none; }
  .c-empty { color: var(--muted); font-size: 14px; text-align: center; padding: 8vh 18px; }
  .c-empty .bl { width: 72px; height: 72px; margin: 0 auto 14px; }
  .c-empty h2 { color: var(--ink); font-size: 24px; margin: 0 0 4px; }
  .round-head { display: flex; gap: 8px; align-items: center; margin-top: 10px; color: var(--muted); font-size: 12px; }
  .round-head::before, .round-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .round-head:first-child { margin-top: 0; }
  .round { display: flex; flex-direction: column; gap: 10px; }
  .round.flash .cm.you .ct { animation: flash 1.2s var(--ease); }
  @keyframes flash { 30% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 45%, transparent); } }
  .cm { display: flex; gap: 9px; align-items: flex-start; animation: in-bot .35s var(--ease) both; }
  .cm .bl { width: 32px; height: 32px; }
  .cm .cb { min-width: 0; flex: 1; }
  .cm .ch { display: flex; gap: 6px; align-items: baseline; font-size: 12.5px; }
  .cm .ch b { font-weight: 650; }
  .cm .ch time, .cm .ch small { color: var(--muted); font-size: 11px; }
  .cm .ct { display: inline-block; margin-top: 2px; padding: 8px 12px; border-radius: 4px 16px 16px 16px; background: var(--panel);
            border: 1px solid var(--line); font-size: 14px; white-space: pre-wrap; word-wrap: break-word; max-width: min(100%, 620px); }
  .cm.you .ct { background: var(--user); color: var(--user-ink); border-color: transparent; }
  .cm.priv .ct { background: transparent; border-style: dashed; color: var(--muted); font-size: 12.5px;
                 font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
  .cm .cq { margin-top: 3px; padding: 2px 8px; border-left: 3px solid var(--line); color: var(--muted); font-size: 12px;
            overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: pointer; max-width: 620px; }
  .cm .cq:hover { color: var(--ink); }
  .cm .cr { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .cm .cr:empty { display: none; }
  .rx { display: inline-flex; align-items: center; gap: 3px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line);
        background: var(--panel); font-size: 12px; line-height: 20px; animation: pop .35s var(--spring) both; }
  .rx i { font-style: normal; color: var(--muted); font-size: 11px; }
  .cm.hl .ct { animation: flash 1.2s var(--ease); }
  #c-typing { max-width: 780px; margin: 0 auto; min-height: 34px; padding: 4px 16px 10px; display: flex; align-items: center;
              gap: 8px; color: var(--muted); font-size: 12.5px; }
  #c-typing .bl { width: 22px; height: 22px; }
  #c-typing .dots i { width: 5px; height: 5px; }
  .wt { margin-left: 8px; color: var(--muted); font-size: 12.5px; }

  /* ---------- detalhes do contato (à direita) */
  #details { width: 330px; flex: none; background: var(--panel); border-left: 1px solid var(--line); display: flex;
             flex-direction: column; transition: margin-right .3s var(--ease); z-index: 7; min-height: 0; }
  body.details-closed #details { margin-right: -330px; }
  #details .d-head { display: flex; justify-content: flex-end; gap: 4px; padding: 8px 8px 0; }
  #d-body { flex: 1; overflow-y: auto; padding: 4px 20px 20px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .d-id { text-align: center; padding: 6px 0 16px; border-bottom: 1px solid var(--line); }
  .d-id .bl { width: 84px; height: 84px; margin: 0 auto 10px; }
  .d-id h3 { margin: 0; font-size: 19px; }
  .d-id p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
  #d-body h4 { margin: 18px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .d-row { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; font-size: 14px; }
  .d-row > svg, .d-row > .bl { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--ok); }
  .d-row.off > svg { color: var(--muted); }
  .d-row .bl { width: 22px !important; height: 22px !important; margin-top: 0 !important; }
  .d-row div { flex: 1; min-width: 0; }
  .d-row small { display: block; color: var(--muted); font-size: 12.5px; }
  .d-row .mini { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 2px 9px; font-size: 12px; color: var(--ink); }
  .d-row .mini:hover { background: var(--chip); }
  .d-actions { display: flex; gap: 8px; margin-top: 18px; }
  .d-actions .btn { flex: 1; }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .stat b { display: block; font-size: 18px; }
  .stat small { color: var(--muted); font-size: 12px; }
  #d-body #chatlist { padding: 0; margin: 0 -8px; }
  #details > #chatlist { display: none; }

  /* ---------- editor de agente */
  .modal form.box.ed { display: block; width: min(560px, 100%); max-width: none; margin: 0; max-height: calc(100vh - 32px);
                       overflow-y: auto; padding: 20px 20px 16px; border-radius: 16px; gap: 0; }
  .modal form.box.ed:focus-within { border-color: var(--line); }
  .ed label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 0; }
  .ed input[type=text], .ed input[type=time], .ed textarea, .ed select {
    width: 100%; margin-top: 4px; font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; outline: 0; }
  .ed input:focus, .ed textarea:focus, .ed select:focus { border-color: color-mix(in srgb, var(--ink) 45%, var(--line)); }
  .ed textarea { resize: vertical; }
  .ed h4 { margin: 18px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .ed-top { display: flex; gap: 14px; align-items: center; }
  .ed-top .bl { width: 64px; height: 64px; }
  .ed-top > div { flex: 1; }
  .cores { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .cores button { width: 30px; height: 30px; padding: 0; border: 2px solid transparent; border-radius: 50%; background: none; }
  .cores button.on { border-color: var(--ink); }
  .cores .bl { width: 100%; height: 100%; }
  .toolgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 10px; }
  .toolgrid label { display: flex; align-items: center; gap: 8px; font-size: 13.5px; padding: 3px 0; cursor: pointer; }
  .toolgrid svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
  .rot { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px 12px; margin-bottom: 8px; background: var(--panel-2); }
  .rot .rl { display: grid; grid-template-columns: 1fr 110px 130px auto; gap: 8px; align-items: end; }
  .rot .rl label.f { margin-top: 8px; }
  .rot .x { border: 0; background: none; color: var(--muted); padding: 8px 4px; }
  .rot .x:hover { color: var(--err); }
  .rot .x svg { width: 16px; height: 16px; }
  .rot small { color: var(--muted); font-size: 12px; }
  .erro { color: var(--err); font-size: 13.5px; min-height: 1em; margin: 12px 0 0; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { opacity: .9; background: var(--accent); }
  @media (max-width: 1180px) {
    #details { position: fixed; top: 0; bottom: 0; right: 0; box-shadow: var(--shadow); width: min(340px, 100vw); }
    body:not(.details-open) #details { margin-right: -350px; }
    body.details-closed #details { margin-right: -350px; }
  }
  @media (max-width: 560px) { .rot .rl { grid-template-columns: 1fr 1fr; } }

  /* aviso de lembrete */
  #toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -200%); background: var(--panel); color: var(--ink);
           border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 0 12px 12px 0; box-shadow: var(--shadow);
           padding: 10px 16px; font-weight: 600; z-index: 10; max-width: 90vw; visibility: hidden;
           transition: transform .5s var(--spring), visibility .5s; }
  #toast.show { transform: translate(-50%, 0); visibility: visible; }

  /* diálogo de confirmação e aviso com "Desfazer" */
  .modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
           background: rgba(0,0,0,.38); animation: fade .2s var(--ease); }
  .modal[hidden] { display: none; }
  .modal.closing { animation: fade .16s var(--ease) reverse forwards; }
  .modal .box { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
                padding: 20px 20px 16px; box-shadow: 0 24px 70px rgba(0,0,0,.28); animation: pop-in .32s var(--spring); }
  .modal.closing .box { animation: pop-in .16s var(--ease) reverse forwards; }
  @keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(.96); } }
  .modal .mic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; margin-bottom: 12px;
                background: color-mix(in srgb, var(--err) 12%, var(--panel)); color: var(--err); }
  .modal .mic svg { width: 20px; height: 20px; }
  .modal h3 { margin: 0 0 6px; font-size: 17px; }
  .modal p { margin: 0; color: var(--muted); font-size: 14px; }
  .modal .mbtns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .btn { border: 1px solid var(--line); background: transparent; border-radius: 10px; padding: 8px 16px; font-weight: 600;
         font-size: 14px; transition: transform .15s var(--ease), background .15s, opacity .15s; }
  .btn:hover { background: var(--chip); }
  .btn:active { transform: scale(.96); }
  .btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
  .btn.danger:hover { opacity: .9; background: var(--err); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #snack { position: fixed; left: 50%; bottom: 92px; z-index: 15; display: flex; align-items: center; gap: 14px;
           background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 10px 10px 16px; font-size: 14px;
           box-shadow: 0 10px 30px rgba(0,0,0,.25); opacity: 0; pointer-events: none;
           transform: translate(-50%, 16px); transition: opacity .25s var(--ease), transform .35s var(--spring); }
  #snack.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  #snack button { border: 0; background: none; color: inherit; font-weight: 700; padding: 4px 10px; border-radius: 8px;
                  text-decoration: underline; text-underline-offset: 3px; }
  #snack button:hover { background: color-mix(in srgb, var(--bg) 15%, transparent); }

  @media (max-width: 900px) {
    #history { position: fixed; top: 0; bottom: 0; left: 0; box-shadow: var(--shadow); }
    body:not(.hist-open) #history { margin-left: -300px; }
    body.hist-open #history { margin-left: 0; }
  }
  @media (max-width: 560px) {
    .msg, .tool { max-width: 88%; }
    .hint { display: none; }
    .row.bot .avatar { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

    <button class="icon-btn" id="histclose" title="Fechar painel (Ctrl+B)" aria-label="Fechar painel"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16M15 10l-2 2 2 2"/></svg></button>
  </div>
  <div id="contacts"></div>

  </div>
</aside>

<div class="app">
<header>
  <button class="icon-btn" id="histbtn" title="Conversas (Ctrl+B)" aria-label="Mostrar conversas">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 4v16"/></svg>
  </button>
  <div class="avatar bl lia" id="hlogo"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="18" y="14" width="10" height="36"/><rect x="18" y="40" width="28" height="10"/><rect x="36" y="24" width="10" height="10"/></svg></div>
  <div class="title"><b id="hname">Lia</b><small><span id="status">conectando...</span></small></div>

    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
  </button>
  <button class="icon-btn" id="infobtn" title="Detalhes" aria-label="Detalhes do contato">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M15 4v16"/></svg>
  </button>
  <button class="icon-btn" id="gear" title="Configurações" aria-label="Configurações">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.3c.4-1.8 2.9-1.8 3.4 0a1.7 1.7 0 0 0 2.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 0 0 1 2.5c1.8.4 1.8 2.9 0 3.4a1.7 1.7 0 0 0-1 2.6c.9 1.5-.9 3.3-2.4 2.4a1.7 1.7 0 0 0-2.6 1c-.4 1.8-2.9 1.8-3.4 0a1.7 1.7 0 0 0-2.6-1c-1.5.9-3.3-.9-2.4-2.4a1.7 1.7 0 0 0-1-2.6c-1.8-.4-1.8-2.9 0-3.4a1.7 1.7 0 0 0 1-2.5c-.9-1.6.9-3.3 2.4-2.4a1.7 1.7 0 0 0 2.6-1.1z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</header>

<main id="scroller">
  <div id="log" class="log"></div>
  <div id="c-log" hidden></div>
  <div id="c-typing" aria-live="polite" hidden></div>
</main>

<footer>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>

</div>

<aside id="details" aria-label="Detalhes">
  <div class="d-head"><button class="icon-btn" id="d-close" title="Fechar" aria-label="Fechar detalhes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div id="d-body"></div>
  <div id="chatlist"></div>
</aside>

<div id="shade"></div>

  <div class="head"><h3>Configurações</h3>
    <button class="icon-btn" id="close" aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>

  <h4>O que eu sei fazer</h4>

<div id="toast" role="status"></div>

  </div>
</div>

<script>
const TOKEN = "__TOKEN__";
const NAME = "Lia";
const GLYPH = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="18" y="14" width="10" height="36"/><rect x="18" y="40" width="28" height="10"/><rect x="36" y="24" width="10" height="10"/></svg>';
const ICONS = {

// ---------- eventos do servidor
let pump = Promise.resolve();
function enqueue(ev) {
  pump = pump.then(() => (ev.type === "conselho" ? councilEvent(ev) : handle(ev))).catch((e) => console.error(e));
}
let repasse = null;
function handle(ev) {
  if (ev.type === "handoff") {
    repasse = ev;
  } else if (ev.type === "debate") {
    clearThinking(); addDebate(ev); showThinking();
  } else if (ev.type === "token") {
    clearThinking();
    if (!bubble) bubble = addMsg("bot", "", "typing");
    const sp = document.createElement("span"); sp.className = "tk"; sp.textContent = ev.text;
    bubble.appendChild(sp); scroll();
  } else if (ev.type === "text") {
    clearThinking();
    if (!bubble) bubble = addMsg("bot", "");
    bubble.classList.remove("typing");
    if (bubble.textContent.trim() !== ev.text.trim()) bubble.textContent = ev.text;
    bubble = null; speak(ev.text); save();
  } else if (ev.type === "call") {
    clearThinking();
    if (bubble) { bubble.classList.remove("typing"); bubble = null; }
    lastCard = addCard(ev);
  } else if (ev.type === "confirm") {
    askConfirm(lastCard);
  } else if (ev.type === "result") {
    setResult(lastCard, ev.text);
    showThinking();
  }
}

async function stream(path, body) {
  body = { ...body, agente: contato };
  streamDe = contato;
  setBusy(true); renderContatos();
  if (!thinking && !pendingCard && path === "/api/chat") showThinking();
  try {
    const res = await api(path, body);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (line.trim()) enqueue(JSON.parse(line));
      }
    }
  } catch (e) {
    clearThinking();
    addMsg("bot", "Perdi a conexão com o servidor (" + e.message + "). Ele ainda tá rodando?", "alert");
    setOnline(false);
  } finally {
    await pump;
    setDebating(false);
    clearThinking();
    if (bubble) bubble.classList.remove("typing");
    bubble = null; setBusy(false); save(); syncTurns(); renderContatos();
    if (!pendingCard) input.focus();
  }
  if (repasse) {
    const ev = repasse, de = contato, texto = lastSent;
    repasse = null;
    postarRepasse(de, ev, texto);
    await abrirContato(ev.para);
    send(texto, nomeDe(de));
  }
}

function send(text, encaminhadoDe) {
  text = text.trim();
  if (!text || busy || contato === "conselho") return;
  log.querySelector(".ag-empty")?.remove();
  if (pendingCard) {
    pendingCard.querySelector(".actions")?.remove();
    setResult(pendingCard, "cancelado: mensagem nova"); pendingCard = null;
  }
  lastSent = text;
  const um = addMsg("user", text);
  if (encaminhadoDe) um.title = "encaminhado por " + encaminhadoDe;
  if (encaminhadoDe) um.insertAdjacentHTML("afterbegin", `<small style="display:block;opacity:.7;font-size:11.5px">↪ encaminhado por ${encaminhadoDe.replace(/[<&]/g, "")}</small>`);
  input.value = ""; input.style.height = ""; sendBtn.disabled = true;
  stream("/api/chat", { text });
}

// ---------- histórico de conversas (salvo neste computador)
const CHATS_KEY = "lia-chats", CUR_KEY = "lia-atual";
let chats = [];
try { chats = JSON.parse(store.get(CHATS_KEY) || "[]"); } catch (e) { chats = []; }
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
let currentId = store.get(CUR_KEY) || newId();
let shownIds = new Set(chats.map((c) => c.id));
const current = () => chats.find((c) => c.id === currentId);
function persist() {
  chats.sort((a, b) => b.updated - a.updated);
  while (!store.set(CHATS_KEY, JSON.stringify(chats)) && chats.length > 1) chats.pop();  // sem espaço: some a mais antiga
  store.set(CUR_KEY, currentId);
}
function snapshot(el = log) {
  const clone = el.cloneNode(true);
  clone.querySelectorAll(".row.thinking").forEach((e) => e.remove());
  clone.querySelectorAll(".actions, .tool.wait .st, .tool.ask .st").forEach((e) => e.remove());
  clone.querySelectorAll(".typing").forEach((e) => e.classList.remove("typing"));
  clone.querySelectorAll(".msg").forEach((m) => { if (m.querySelector(".tk")) m.textContent = m.textContent; });
  return clone.innerHTML;
}
function save() {
  salvarSala();
  if (contato === "conselho") return;
  if (contato !== "lia") {
    if (log.querySelector(".row")) gravarAgente(contato, { html: snapshot() });
    return renderContatos();
  }
  if ($("empty") || !log.querySelector(".row.user")) return;
  let c = current();
  if (!c) { c = { id: currentId, title: "", turns: [] }; chats.unshift(c); }
  c.html = snapshot(); c.updated = Date.now();
  if (!c.title) c.title = (log.querySelector(".row.user .msg")?.textContent || "Conversa").slice(0, 60);
  persist(); renderHistory();
}
let syncing = Promise.resolve();
function syncTurns() {  // guarda o contexto do modelo junto da conversa (para reabrir depois)
  if (contato !== "lia" && contato !== "conselho") {
    const id = contato;
    syncing = (async () => {
      try { gravarAgente(id, { turns: (await (await api("/api/turns?agente=" + encodeURIComponent(id))).json()).turns }); } catch (e) {}
    })();
    return;
  }
  const c = current();
  if (!c) return;
  syncing = (async () => {
    try { c.turns = (await (await api("/api/turns")).json()).turns; persist(); } catch (e) {}
  })();
}
function groupOf(t) {
  const d = new Date(t), today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  return diff <= 0 ? "Hoje" : diff === 1 ? "Ontem" : diff < 7 ? "Últimos 7 dias" : "Mais antigas";
}
function renderHistory() {
  const box = $("chatlist"); box.innerHTML = "";
  if (!chats.length) { box.innerHTML = '<div class="hist-empty">Suas conversas aparecem aqui.</div>'; return; }
  let group = null;
  for (const c of chats) {
    const g = groupOf(c.updated);
    if (g !== group) { const h = document.createElement("h5"); h.textContent = group = g; box.appendChild(h); }
    const b = document.createElement("button");
    b.className = "chat-item" + (c.id === currentId ? " on" : "") + (shownIds.has(c.id) ? "" : " new");
    b.title = c.title;
    b.innerHTML = `<span></span><span class="del" role="button" tabindex="0" aria-label="Apagar conversa" title="Apagar">${ICON("trash")}</span>`;
    b.firstChild.textContent = c.title;
    b.onclick = (e) => { if (e.target.closest(".del")) deleteChat(c.id); else openChat(c.id); };
    box.appendChild(b);
    shownIds.add(c.id);
  }
}
function showChat(c) {
  log.innerHTML = c.html || ""; log.classList.add("restored");
  log.classList.remove("swap"); void log.offsetWidth; log.classList.add("swap");
  const last = log.lastElementChild?.classList;
  lastRole = last?.contains("user") ? "user" : last ? "bot" : null;
  requestAnimationFrame(scroll);
}
async function openChat(id) {
  if (contato !== "lia") await abrirContato("lia");
  if (busy || id === currentId) return closeHistoryIfOverlay();
  const c = chats.find((x) => x.id === id);
  if (!c) return;
  await syncing;
  currentId = id; pendingCard = null; store.set(CUR_KEY, id);
  showChat(c); renderHistory(); closeHistoryIfOverlay();
  try { await api("/api/load", { turns: c.turns || [] }); } catch (e) {}
  input.focus();
}
async function newChat() {
  if (contato !== "lia") await abrirContato("lia");
  if (busy) return;
  await syncing;
  try { await api("/api/reset", {}); } catch (e) {}
  currentId = newId(); pendingCard = null; store.set(CUR_KEY, currentId);
  showEmpty(); renderHistory(); renderContatos(); closeHistoryIfOverlay(); input.focus();
}
// diálogo de confirmação no estilo da interface (Enter confirma, Esc cancela)
let modalOpen = false;
function ask(title, body, okText) {
  return new Promise((resolve) => {
    const m = $("modal");
    $("mtitle").textContent = title; $("mbody").textContent = body; $("myes").textContent = okText;
    m.hidden = false; m.classList.remove("closing"); modalOpen = true;
    const prev = document.activeElement;
    $("mno").focus();
    const done = (v) => {
      document.removeEventListener("keydown", onKey, true);
      m.classList.add("closing"); modalOpen = false;
      setTimeout(() => { m.hidden = true; m.classList.remove("closing"); }, 160);
      prev?.focus?.(); resolve(v);
    };
    const onKey = (e) => {
      if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); done(false); }
      else if (e.key === "Tab") { e.preventDefault(); (document.activeElement === $("myes") ? $("mno") : $("myes")).focus(); }
    };
    document.addEventListener("keydown", onKey, true);
    $("myes").onclick = () => done(true);
    $("mno").onclick = () => done(false);
    m.onclick = (e) => { if (e.target === m) done(false); };
  });
}
// aviso embaixo com "Desfazer"
function snack(text, onUndo) {
  const s = $("snack");
  $("snacktext").textContent = text; s.classList.add("show");
  clearTimeout(s._h); s._h = setTimeout(() => s.classList.remove("show"), 6000);
  $("snackbtn").hidden = !onUndo;
  $("snackbtn").onclick = () => { s.classList.remove("show"); clearTimeout(s._h); onUndo?.(); };
}
async function deleteChat(id) {
  const c = chats.find((x) => x.id === id);
  if (!c) return;
  if (!await ask("Apagar esta conversa?", `"${c.title}" vai sumir do histórico.`, "Apagar")) return;
  const wasCurrent = id === currentId;
  chats = chats.filter((x) => x.id !== id); persist();
  if (wasCurrent) newChat(); else renderHistory();
  snack("Conversa apagada", () => {
    chats.push(c); persist();
    if (wasCurrent) openChat(c.id); else renderHistory();
  });
}
$("clearall").onclick = async () => {
  if (!chats.length) return;
  const n = chats.length;
  const ok = await ask("Apagar todas as conversas?",
    n === 1 ? "A conversa salva neste computador vai sumir. Não dá para desfazer."
            : `As ${n} conversas salvas neste computador vão sumir. Não dá para desfazer.`, "Apagar tudo");
  if (!ok) return;
  chats = []; persist(); openSettings(false); newChat();
};

// painel de conversas: fixo ao lado em tela larga, por cima em tela estreita
const narrow = () => matchMedia("(max-width: 900px)").matches;
function toggleHistory(open) {
  if (narrow()) {
    document.body.classList.toggle("hist-open", open);
  } else {
    document.body.classList.toggle("hist-closed", !open);
    store.set("lia-painel", open ? "1" : "0");
  }
}
const historyOpen = () => narrow() ? document.body.classList.contains("hist-open") : !document.body.classList.contains("hist-closed");
function closeHistoryIfOverlay() { if (narrow()) document.body.classList.remove("hist-open"); }
$("histbtn").onclick = () => toggleHistory(!historyOpen());
$("histclose").onclick = () => toggleHistory(false);
if (store.get("lia-painel") === "0") document.body.classList.add("hist-closed");

// ---------- configurações
function openSettings(open) { $("settings").classList.toggle("open", open); $("shade").classList.toggle("open", open); }
$("gear").onclick = $("gear2").onclick = () => openSettings(!$("settings").classList.contains("open"));
$("close").onclick = $("shade").onclick = () => openSettings(false);
$("auto").onchange = () => api("/api/settings", { auto: $("auto").checked });
$("conselho").onchange = () => api("/api/settings", { conselho: $("conselho").checked });
$("temp").oninput = () => { $("tempval").textContent = $("temp").value; };
$("temp").onchange = () => api("/api/settings", { temperature: parseFloat($("temp").value) });
$("voice").checked = store.get("voz") === "1";
$("voice").onchange = () => store.set("voz", $("voice").checked ? "1" : "0");
$("notif").checked = store.get("notif") === "1" && window.Notification?.permission === "granted";
$("notif").onchange = async () => {
  if ($("notif").checked && window.Notification && Notification.permission !== "granted") {
    $("notif").checked = (await Notification.requestPermission()) === "granted";
  }
  store.set("notif", $("notif").checked ? "1" : "0");
};
function applyTheme(v, animate) {
  const root = document.documentElement;
  if (animate) { root.classList.add("theming"); setTimeout(() => root.classList.remove("theming"), 350); }
  if (v === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", v);
  document.querySelectorAll("#theme button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
  store.set("tema", v);
}
document.querySelectorAll("#theme button").forEach((b) => b.onclick = () => applyTheme(b.dataset.v, true));
applyTheme(store.get("tema") || "auto");

$("newchat").onclick = newChat;

// ---------- teclado
$("form").onsubmit = (e) => { e.preventDefault(); send(input.value); };
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
  else if (e.key === "ArrowUp" && !input.value && lastSent) { e.preventDefault(); input.value = lastSent; input.dispatchEvent(new Event("input")); }
});
input.addEventListener("input", () => {
  input.style.height = "auto"; input.style.height = input.scrollHeight + "px";
  sendBtn.disabled = busy || !input.value.trim();
});
document.addEventListener("keydown", (e) => {
  if (modalOpen) return;
  if (e.key === "Escape") {
    if ($("settings").classList.contains("open")) openSettings(false);
    else if (narrow() && historyOpen()) toggleHistory(false);
    else if (narrow1180() && detalhesAberto()) abrirDetalhes(false);
    else if (pendingCard && !busy) pendingCard._answer(false);
  } else if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "o") { e.preventDefault(); newChat(); }
  else if (e.ctrlKey && !e.shiftKey && e.key.toLowerCase() === "b") { e.preventDefault(); toggleHistory(!historyOpen()); }
});

// ---------- conexão e informações
function setOnline(on, text) {
  online = on;
  if (text) statusLia = text;
  if (text && contato === "lia") $("status").textContent = text;
}
async function loadInfo() {
  try {
    const info = await (await api("/api/info")).json();
    setOnline(true, `${(info.params / 1e6).toFixed(1)}M parâmetros · ${info.apps} apps` + (info.simulado ? " · modo simulado" : ""));
    $("auto").checked = info.auto; $("conselho").checked = info.conselho;
    ferramentasInfo = info.tools;
    $("temp").value = info.temperature; $("tempval").textContent = info.temperature;
    $("toollist").innerHTML = "";
    for (const t of info.tools) {
      const [icon, label] = LABELS[t.name] || ["gear", t.name];
      const li = document.createElement("li");
      li.innerHTML = "<span></span><span></span><small></small>";
      li.children[0].innerHTML = ICON(icon); li.children[1].textContent = label; li.children[2].textContent = t.desc;
      if (t.confirm) li.children[1].insertAdjacentHTML("beforeend", '<span class="tag">pede confirmação</span>');
      $("toollist").appendChild(li);
    }
  } catch (e) { setOnline(false, "sem conexão com o servidor"); }
}

// Lembretes que disparam enquanto a página está aberta
function notifyReminder(text) {
  const t = $("toast"); t.textContent = "⏰ " + text; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 8000);
  addMsg("bot", "⏰ Lembrete: " + text, "alert"); speak("Lembrete: " + text);
  if ($("notif").checked && window.Notification?.permission === "granted") {
    try { new Notification(NAME + " · lembrete", { body: text, tag: "lia-" + Date.now() }); } catch (e) {}
  }
  document.title = "⏰ " + NAME;
}
window.addEventListener("focus", () => { document.title = NAME; });
setInterval(async () => {
  try {
    const evs = await (await api("/api/events")).json();
    if (!online) loadInfo();
    for (const ev of evs) {
      if (ev.type === "rotina") {
        addRotina(ev.agente, ev.nome, ev.texto);
        const t = $("toast"); t.textContent = `🔁 ${nomeDe(ev.agente)}: ${ev.nome}`; t.classList.add("show");
        clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 6000);
        if ($("notif").checked && window.Notification?.permission === "granted") {
          try { new Notification(nomeDe(ev.agente) + " · " + ev.nome, { body: ev.texto, tag: "lia-" + Date.now() }); } catch (e) {}
        }
      } else notifyReminder(ev.text);
    }
  } catch (e) { if (online) setOnline(false, "sem conexão com o servidor"); }
}, 4000);

// ---------- início: reabre a última conversa (e o contexto dela no modelo)
(async () => {
  showCouncil(store.get("lia-conselho") || "");
  if (store.get("lia-detalhes") === "0") document.body.classList.add("details-closed");
  const c = current();
  if (c?.html) {
    showChat(c);
    try { await api("/api/load", { turns: c.turns || [] }); } catch (e) {}
  } else {
    showEmpty();
  }
  renderHistory();
  await loadInfo();
  await carregarAgentes();
  const ultimo = store.get("lia-contato");
  abrirContato(ultimo && (ultimo === "conselho" || agente(ultimo)) ? ultimo : "lia");
})();
