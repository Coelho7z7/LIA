<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste do motor</title>
<style>
  :root { --bg: #fff; --ink: #111; --muted: #666; --line: #ddd; --panel: #f6f6f6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --ink: #eee; --muted: #999; --line: #333; --panel: #1b1b1b; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  #log { min-height: 300px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--panel);
         white-space: pre-wrap; overflow-wrap: anywhere; }
  .u { font-weight: 600; } .c { color: #2a7; font-family: ui-monospace, monospace; } .m { color: var(--muted); font-size: 13px; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  button { padding: 10px 16px; border-radius: 10px; border: 0; background: var(--ink); color: var(--bg); font: inherit; }
  button:disabled { opacity: .4; }
</style>
</head>
<body>
<main>
  <h1>Teste do motor JS</h1>
  <p class="m" id="status">Carregando…</p>
  <div id="log"></div>
  <form id="f"><input id="q" placeholder="Fala com a Lia" autocomplete="off" disabled><button id="go" disabled>Enviar</button></form>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
const log = $("log");
const add = (cls, text) => { const s = document.createElement("div"); s.className = cls; s.textContent = text; log.append(s); return s; };
const w = new Worker("engine/worker.js", { type: "module" });
let reply = null;
// resultados simulados só para este teste (as ferramentas de verdade vêm na interface)
function simular(tool, arg) {
  const now = new Date();
  if (tool === "hora") return `ok: ${now.toTimeString().slice(0, 5)}`;
  if (tool === "data") return `ok: ${now.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}`;
  if (tool === "lembrar") return "ok: guardei";
  if (tool === "abrir_app") return `ok: abri ${arg}`;
  if (tool === "pesquisar") return "ok: pesquisa aberta no navegador";
  if (tool === "youtube") return "ok: busca aberta no youtube";
  return "ok: feito (simulado)";
}
w.onmessage = (e) => {
  const m = e.data;
  if (m.type === "progresso") $("status").textContent = `Baixando pesos: ${(m.feito / 2 ** 20).toFixed(1)} de ${(m.total / 2 ** 20).toFixed(1)} MiB`;
  else if (m.type === "pronta") {
    $("status").textContent = `Pronta (passo ${m.info.passo}, cópia forçada ${m.info.copia ? "ligada" : "desligada"}, montou em ${m.info.ms} ms)`;
    $("q").disabled = $("go").disabled = false; $("q").focus();
  } else if (m.type === "token") { reply = reply || add("", "Lia: "); reply.textContent += m.text; }
  else if (m.type === "call") {
    add("c", `[ferramenta] ${m.tool}: ${m.arg}`);
    const r = simular(m.tool, m.arg); add("m", `  -> ${r}`);
    w.postMessage({ type: "resultado", text: r });
  } else if (m.type === "fim") {
    add("m", `${m.tokens} tokens em ${m.ms} ms (${(m.tokens / (m.ms / 1000)).toFixed(1)} tokens/s)`);
    reply = null; $("q").disabled = $("go").disabled = false; $("q").focus();
  } else if (m.type === "erro") add("m", "erro: " + m.message);
};
// endereço completo: dentro do worker, caminho relativo partiria de engine/
w.postMessage({ type: "carregar", base: new URL("modelo", location.href).href });
$("f").onsubmit = (e) => {
  e.preventDefault();
  const text = $("q").value.trim(); if (!text) return;
  add("u", "Você: " + text); $("q").value = ""; $("q").disabled = $("go").disabled = true; reply = null;
  w.postMessage({ type: "falar", text });
};
</script>
</body>
</html>
